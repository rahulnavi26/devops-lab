groups:
  - name: devops-lab
    rules:
      - alert: AppDown
        expr: up{job=~"devops-lab|kubernetes-pods"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Target {{ $labels.instance }} is down"
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[2m])) / sum(rate(http_requests_total[2m])) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "More than 5% of requests are failing"
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p95 latency is above 500 ms"
